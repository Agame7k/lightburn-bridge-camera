name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.7 is what the Bridge runs (Raspberry Pi OS Buster)
        image: ["python:3.7-slim", "python:3.12-slim"]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Self-test
        run: python lbcam_stream.py --selftest
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build update package
        run: python make_update.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches VERSION
        run: |
          v=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' lbcam_stream.py)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but VERSION is $v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build update package
        run: python3 make_update.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "lbcam-update-$VERSION.tar.gz" --title "$GITHUB_REF_NAME" --generate-notes
